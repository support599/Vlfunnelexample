<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pro Paid Media</title>
<style>
  @font-face {
    font-family: 'Montserrat';
    font-weight: 500;
    src: url('fonts/Montserrat-500.ttf') format('truetype');
  }
  @font-face {
    font-family: 'Montserrat';
    font-weight: 600;
    src: url('fonts/Montserrat-600.ttf') format('truetype');
  }
  @font-face {
    font-family: 'Montserrat';
    font-weight: 700;
    src: url('fonts/Montserrat-700.ttf') format('truetype');
  }
  @font-face {
    font-family: 'Montserrat';
    font-weight: 900;
    src: url('fonts/Montserrat-900.ttf') format('truetype');
  }
  @font-face {
    font-family: 'Alex Brush';
    font-weight: 400;
    src: url('fonts/AlexBrush-Regular.ttf') format('truetype');
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    background: #0a0a0a;
    font-family: 'Montserrat', sans-serif;
    color: #fff;
  }

  .phone {
    container-type: inline-size;
    container-name: phone;
    max-width: 520px;
    margin: 0 auto;
    background: #0a0a0a;
    padding-bottom: 6cqw;
  }

  header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    padding: 3.9cqw 5.6cqw 0 5.6cqw;
  }

  .logo {
    display: flex;
    flex-direction: column;
    line-height: 0.82;
  }

  .logo .bad {
    font-weight: 900;
    font-size: 8.6cqw;
    letter-spacing: 0.2cqw;
  }

  .logo .marketing {
    font-weight: 600;
    font-size: 2.385cqw;
    letter-spacing: 0.537cqw;
    margin-top: 0.9cqw;
    margin-left: 0.1cqw;
  }

  .nav-right {
    display: flex;
    align-items: center;
    gap: 2.2cqw;
    margin-top: 0.5cqw;
  }

  .work-btn {
    background: linear-gradient(180deg, #7c1c2c 0%, #63111e 100%);
    border: 1px solid #8f2e3d;
    color: #fff;
    font-weight: 700;
    font-size: 3.1cqw;
    padding: 2.15cqw 5.1cqw;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
  }

  .menu-btn {
    background: none;
    border: none;
    cursor: pointer;
    width: 6.3cqw;
    height: 4.9cqw;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: stretch;
    padding: 0;
  }

  .menu-btn span {
    display: block;
    width: 100%;
    height: 2px;
    background: #fff;
    border-radius: 2px;
  }

  main {
    padding: 0 2.65cqw;
    margin-top: 9.9cqw;
  }

  .hero-card {
    position: relative;
    border-radius: 4.5cqw;
    overflow: hidden;
    width: 100%;
    aspect-ratio: 1096 / 1607;
    background:
      linear-gradient(160deg, #9db4c7 0%, #8ba4b9 35%, #7891a8 70%, #6f899f 100%);
  }

  .hero-card .sheen {
    position: absolute;
    inset: 0;
    overflow: hidden;
  }

  .hero-card .sheen::before,
  .hero-card .sheen::after {
    content: "";
    position: absolute;
    left: -60%;
    width: 220%;
    background: linear-gradient(
      100deg,
      transparent 42%,
      rgba(255, 255, 255, 0.16) 48%,
      rgba(255, 255, 255, 0.24) 50%,
      rgba(255, 255, 255, 0.16) 52%,
      transparent 58%
    );
  }

  .hero-card .sheen::before {
    top: 20%;
    height: 95%;
    transform: rotate(-30deg);
  }

  .hero-card .sheen::after {
    top: 55%;
    height: 50%;
    transform: rotate(-30deg);
    opacity: 0.55;
  }

  .hero-logo {
    position: absolute;
    left: 17.9%;
    top: 40.9%;
    width: 65%;
    text-align: left;
    z-index: 2;
  }

  .hero-logo .bad {
    font-weight: 900;
    font-size: 24.5cqw;
    line-height: 0.82;
    color: #fff;
    letter-spacing: -0.2cqw;
    white-space: nowrap;
  }

  .hero-logo .marketing {
    font-weight: 500;
    font-size: 7.75cqw;
    letter-spacing: 0.74cqw;
    color: #fff;
    margin-top: 1.6cqw;
    white-space: nowrap;
  }

  .a-glyph {
    height: 0.7em;
    width: auto;
    vertical-align: baseline;
    margin-left: 0.05em;
    position: relative;
    top: 0.01em;
  }

  .hero-footer {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 8.4%;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    padding: 0 6.5%;
    z-index: 2;
  }

  .signature {
    display: flex;
    flex-direction: column;
    color: #fff;
  }

  .signature .script {
    font-family: 'Alex Brush', cursive;
    font-weight: 400;
    font-size: 9.2cqw;
    line-height: 0.7;
    white-space: nowrap;
  }

  .signature .caption {
    font-size: 2.15cqw;
    letter-spacing: 0.45cqw;
    margin-top: 1cqw;
    margin-left: 3.6cqw;
    font-weight: 600;
  }

  .speck-logo {
    display: flex;
    align-items: center;
    gap: 0.7cqw;
    color: #fff;
  }

  .speck-logo svg {
    width: 3.6cqw;
    height: 3.6cqw;
    flex-shrink: 0;
  }

  .speck-logo .paren {
    font-size: 4.4cqw;
    font-weight: 500;
    line-height: 1;
  }

  .speck-logo .word {
    font-size: 5cqw;
    font-weight: 600;
    font-family: 'Montserrat', sans-serif;
    font-style: italic;
    margin-left: 0.2cqw;
  }
</style>
</head>
<body>
  <div class="phone">
    <header>
      <div class="logo">
        <span class="bad">PRO</span>
        <span class="marketing">PAID MEDI<svg class="a-glyph" viewBox="0 0 66 72" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><polygon points="48,2 58,2 12,70 2,70" /><rect x="54" y="2" width="10" height="68" /><rect x="20" y="44" width="34" height="10" /></svg></span>
      </div>
      <div class="nav-right">
        <button class="work-btn">Work With Us</button>
        <button class="menu-btn" aria-label="Open menu">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
    </header>

    <main>
      <div class="hero-card">
        <div class="sheen"></div>

        <div class="hero-logo">
          <div class="bad">PRO</div>
          <div class="marketing">PAID MEDI<svg class="a-glyph" viewBox="0 0 66 72" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><polygon points="48,2 58,2 12,70 2,70" /><rect x="54" y="2" width="10" height="68" /><rect x="20" y="44" width="34" height="10" /></svg></div>
        </div>

        <div class="hero-footer">
          <div class="signature">
            <span class="script">Jay Shetty</span>
            <span class="caption">SHETTY</span>
          </div>
          <div class="speck-logo">
            <span class="paren">(</span>
            <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
              <g stroke="#fff" stroke-width="3.4" stroke-linecap="round">
                <line x1="16" y1="3" x2="16" y2="29" />
                <line x1="16" y1="3" x2="16" y2="29" transform="rotate(60 16 16)" />
                <line x1="16" y1="3" x2="16" y2="29" transform="rotate(120 16 16)" />
              </g>
            </svg>
            <span class="paren">)</span>
            <span class="word">speck</span>
          </div>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
